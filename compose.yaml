services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bibliotheque_faculte
      MYSQL_USER: librarian
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.local}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: librarian:dev
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.local}
      DATABASE_URL: "mysql://librarian:${DB_PASSWORD}@db:3306/bibliotheque_faculte?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8000"
    restart: unless-stopped

volumes:
  db_data:
